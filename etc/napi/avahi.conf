# napi-avahi: how this NAPI shows up on the LAN. After a change: napi-avahi update
# (or use "napi-avahi role ..." / "napi-avahi name ...", they update at once).
#
# ROLE: what the board does, any words with commas: donoff, mgate, switch ...
ROLE=
# NAME: own mDNS name (a-z, 0-9, '-'); empty = napi<SoC>-<last 4 hex of MAC>
NAME=
